codecov:
    require_ci_to_pass: true

coverage:
    precision: 2
    range: "70...100"
    round: "down"
    status:
        project:
            default:
                target: "auto"
                threshold: "1%"
        patch:
            default:
                target: "80%"

github_checks:
    annotations: true

ignore:
    - "test/**"

comment:
    layout: "reach,diff,flags,tree"
    behavior: "default"
    require_changes: true
